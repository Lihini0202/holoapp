# Choreo component descriptor, schema 1.1. The port lives under `service`; the
# flat `port` field of schema 1.0 is no longer accepted.
schemaVersion: 1.1
endpoints:
  - name: holo-api
    displayName: Holo Analysis API
    service:
      basePath: /
      port: 8000
    type: REST
    networkVisibilities:
      - Public
