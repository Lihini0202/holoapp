name: CI

# Runs before Choreo picks up the commit, so a broken build surfaces here rather
# than in a deployment. Each job checks whether its own directory changed, so a
# frontend-only commit does not rebuild the backend container.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Two commits are needed to diff against the parent. Path filtering is
          # done with git rather than a third-party action to keep the workflow
          # free of dependencies that need tracking for runtime deprecations.
          fetch-depth: 2

      - name: Check for backend changes
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] || ! git rev-parse HEAD^ >/dev/null 2>&1; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet HEAD^ HEAD -- backend/ .github/workflows/ci.yml; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No backend changes; skipping."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v6
        if: steps.changed.outputs.run == 'true'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        if: steps.changed.outputs.run == 'true'
        working-directory: backend
        run: |
          pip install -r requirements.txt
          pip install pyflakes

      - name: Lint
        if: steps.changed.outputs.run == 'true'
        working-directory: backend
        run: pyflakes main.py tasks.py celery_config.py

      - name: Verify the model loads and discriminates
        if: steps.changed.outputs.run == 'true'
        working-directory: backend
        run: |
          python - <<'PY'
          import joblib, pandas as pd

          model = joblib.load('chat_ghosting_model.pkl')
          columns = joblib.load('chat_model_columns.pkl')
          meta = joblib.load('chat_model_metadata.pkl')
          assert columns == meta['features'], 'model columns and metadata disagree'

          # A disengaged conversation must score above an engaged one. Loading the
          # model alone would still pass if its features were saved reordered or
          # inverted, which is the failure this guards against.
          worst = float(model.predict_proba(pd.DataFrame([[0, 0, 1]], columns=columns))[0, 1])
          best = float(model.predict_proba(pd.DataFrame([[4, 3, 2]], columns=columns))[0, 1])
          assert worst > 0.9, f'disengaged conversation scored {worst:.3f}'
          assert best < 0.1, f'engaged conversation scored {best:.3f}'
          print(f'model OK: disengaged {worst:.3f}, engaged {best:.3f}')
          PY

      - name: Build the container
        if: steps.changed.outputs.run == 'true'
        run: docker build -t holo-backend ./backend

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Check for frontend changes
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] || ! git rev-parse HEAD^ >/dev/null 2>&1; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet HEAD^ HEAD -- frontend/ .github/workflows/ci.yml; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No frontend changes; skipping."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: subosito/flutter-action@v2
        if: steps.changed.outputs.run == 'true'
        with:
          channel: stable
          cache: true

      # .env is declared as an asset in pubspec.yaml, so flutter analyze fails
      # without it. It is not committed, so the template stands in: these are
      # placeholder values and the job proves the build compiles rather than
      # producing a deployable artefact.
      - name: Write placeholder configuration
        if: steps.changed.outputs.run == 'true'
        working-directory: frontend
        run: cp .env.example .env

      - name: Install packages
        if: steps.changed.outputs.run == 'true'
        working-directory: frontend
        run: flutter pub get

      - name: Analyze
        if: steps.changed.outputs.run == 'true'
        working-directory: frontend
        run: flutter analyze

      - name: Build web
        if: steps.changed.outputs.run == 'true'
        working-directory: frontend
        run: flutter build web --release
