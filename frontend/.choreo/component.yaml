# Choreo component descriptor. nginx serves the built Flutter bundle on 8080;
# Choreo disallows binding privileged ports as a non-root user.
#
# The type is REST because the schema accepts only REST, GraphQL, GRPC, TCP, UDP
# or WS. A static site is none of these strictly, but REST is the entry that
# describes plain HTTP traffic.
schemaVersion: "1.2"
endpoints:
    - name: holo-web
      displayName: Holo Web Client
      service:
        basePath: /
        port: 8080
      type: REST
      networkVisibilities:
        - Public
