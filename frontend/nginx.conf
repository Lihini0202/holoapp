# Full nginx configuration, replacing /etc/nginx/nginx.conf.
#
# Choreo runs the container with a read-only root filesystem, so nginx cannot
# create its default temp directories under /var/cache/nginx or write its pid to
# /run. Every writable path is therefore pointed at /tmp, which is mounted
# writable. Serving static files needs none of these in practice; nginx creates
# them at startup regardless and refuses to start if it cannot.
#
# The `user` directive is omitted: the container runs as a non-root user and nginx
# warns that the directive is meaningless without super-user privileges.

worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    sendfile    on;
    tcp_nopush  on;
    keepalive_timeout 65;

    gzip on;
    gzip_types text/css application/javascript application/json application/wasm image/svg+xml;
    gzip_min_length 1024;

    server {
        # Choreo routes to 8080 and disallows binding privileged ports as non-root.
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Flutter web is a single-page application: unknown paths are routes, not
        # missing files, so they are handed to index.html rather than returning 404.
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Hashed build assets are immutable and safe to cache for a long time.
        location ~* \.(?:js|css|png|jpg|jpeg|svg|woff2?|ttf|otf|wasm)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # index.html and the service worker must not be cached, or clients keep
        # loading a previous build after a deployment.
        location ~* ^/(index\.html|flutter_service_worker\.js)$ {
            expires -1;
            add_header Cache-Control "no-store, must-revalidate";
        }
    }
}
